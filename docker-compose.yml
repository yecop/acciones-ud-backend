services:
  postgres:
    image: postgres:16-alpine
    container_name: acciones-ud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acciones_ud}
      POSTGRES_USER: ${POSTGRES_USER:-acciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acciones_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: acciones-ud-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: acciones-ud-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: