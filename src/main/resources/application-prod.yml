spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    co.edu.udistrital.accionesud: INFO

accionesud:
  auth:
    demo:
      habilitado: false
