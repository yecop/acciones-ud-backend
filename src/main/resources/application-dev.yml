spring:
  config:
    activate:
      on-profile: dev
  # --- nuevo ---
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:acciones_ud}
    username: ${POSTGRES_USER:acciones}
    password: ${POSTGRES_PASSWORD:acciones_dev}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    co.edu.udistrital.accionesud: DEBUG

accionesud:
  auth:
    jwt:
      secreto: ${AUTH_JWT_SECRET:dev-secreto-jwt-acciones-ud-2026-32bytes-minimo}
