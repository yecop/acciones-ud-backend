spring:
  config:
    activate:
      on-profile: dev
  # --- nuevo ---
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:acciones_ud}
    username: ${POSTGRES_USER:acciones}
    password: ${POSTGRES_PASSWORD:acciones_dev}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    co.edu.udistrital.accionesud: DEBUG

accionesud:
  security:
    usuario: ${ACCIONESUD_SECURITY_USUARIO:usuario-dev}
    clave: ${ACCIONESUD_SECURITY_CLAVE:clave-dev}
    roles: ${ACCIONESUD_SECURITY_ROLES:INVERSIONISTA}