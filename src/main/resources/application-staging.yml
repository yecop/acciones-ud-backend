spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    co.edu.udistrital.accionesud: INFO

accionesud:
  cors:
    allowed-origins: ${ACCIONESUD_CORS_ALLOWED_ORIGINS:}
  auth:
    jwt:
      secreto: ${AUTH_JWT_SECRET:}
    demo:
      habilitado: false
