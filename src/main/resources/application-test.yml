spring:
  config:
    activate:
      on-profile: test
  main:
    banner-mode: "off"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

accionesud:
  auth:
    jwt:
      secreto: ${AUTH_JWT_SECRET:test-secreto-jwt-acciones-ud-2026-32bytes-minimo}
    demo:
      habilitado: false
  mercados:
    cotizaciones:
      actualizador-habilitado: false
      cache:
        tipo: memoria

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    root: WARN
    co.edu.udistrital.accionesud: INFO
