spring:
  application:
    name: acciones-ud-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

accionesud:
  saldo-inicial-simulado: ${ACCIONESUD_SALDO_INICIAL_SIMULADO:100000.00}
  auth:
    jwt:
      secreto: ${AUTH_JWT_SECRET:}
      emisor: ${AUTH_JWT_EMISOR:acciones-ud}
      access-ttl-segundos: ${AUTH_ACCESS_TTL_SEGUNDOS:900}
      refresh-ttl-segundos: ${AUTH_REFRESH_TTL_SEGUNDOS:604800}
    mfa:
      expiracion-segundos: ${AUTH_MFA_EXPIRACION_SEGUNDOS:300}
      max-intentos: ${AUTH_MFA_MAX_INTENTOS:5}
      bloqueo-segundos: ${AUTH_MFA_BLOQUEO_SEGUNDOS:900}
      reenvio-espera-segundos: ${AUTH_MFA_REENVIO_ESPERA_SEGUNDOS:60}
      max-reenvios: ${AUTH_MFA_MAX_REENVIOS:3}
      longitud-codigo: ${AUTH_MFA_LONGITUD_CODIGO:6}
    correo:
      remitente: ${AUTH_CORREO_REMITENTE:no-reply@accionesud.local}
      asunto: ${AUTH_CORREO_ASUNTO:Código de verificación - Acciones UD}
    login:
      max-fallos: ${AUTH_LOGIN_MAX_FALLOS:5}
      ventana-segundos: ${AUTH_LOGIN_VENTANA_SEGUNDOS:900}
    demo:
      correo: ${AUTH_DEMO_CORREO:inversionista@accionesud.local}
      clave: ${AUTH_DEMO_CLAVE:Clave123!}
  cors:
    # Orígenes permitidos para el frontend (separados por coma).
    # Vite usa 5173 por defecto; CRA usa 3000.
    allowed-origins: ${ACCIONESUD_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mercados:
    # Caché de respuestas de proveedores para respetar los límites de los planes
    # gratuitos. El estado por horario no se cachea (es cálculo local e instantáneo).
    cache:
      enabled: ${MERCADOS_CACHE_ENABLED:true}
      ttl-segundos: ${MERCADOS_CACHE_TTL_SEGUNDOS:60}
    # Credenciales de proveedores de datos de mercado.
    # Los valores reales llegan por variables de entorno (ver .env.example);
    # aquí solo se referencian para no exponer secretos en el repositorio.
    proveedores:
      alpaca:
        api-key: ${ALPACA_API_KEY:}
        api-secret: ${ALPACA_API_SECRET:}
        base-url: ${ALPACA_BASE_URL:https://paper-api.alpaca.markets}
      alpha-vantage:
        api-key: ${ALPHA_VANTAGE_API_KEY:}
        base-url: ${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co}
      finnhub:
        api-key: ${FINNHUB_API_KEY:}
      polygon:
        api-key: ${POLYGON_API_KEY:}
    # Lista de feriados configurable por mercado (fecha en formato ISO yyyy-MM-dd).
    # Permite administrar cierres por feriado sin modificar el código de dominio.
    feriados:
      - mercado: NYSE
        fecha: 2026-01-01
        descripcion: "Año Nuevo"
      - mercado: NASDAQ
        fecha: 2026-01-01
        descripcion: "Año Nuevo"
      - mercado: NYSE
        fecha: 2026-12-25
        descripcion: "Navidad"
      - mercado: LSE
        fecha: 2026-12-25
        descripcion: "Christmas Day"
      - mercado: TSE
        fecha: 2026-01-01
        descripcion: "Ganjitsu (Año Nuevo)"
      - mercado: ASX
        fecha: 2026-01-26
        descripcion: "Australia Day"
