spring:
  application:
    name: acciones-ud-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

accionesud:
  saldo-inicial-simulado: ${ACCIONESUD_SALDO_INICIAL_SIMULADO:100000.00}
  security:
    usuario: ${ACCIONESUD_SECURITY_USUARIO:}
    clave: ${ACCIONESUD_SECURITY_CLAVE:}
    roles: ${ACCIONESUD_SECURITY_ROLES:INVERSIONISTA}
  mercados:
    # Lista de feriados configurable por mercado (fecha en formato ISO yyyy-MM-dd).
    # Permite administrar cierres por feriado sin modificar el código de dominio.
    feriados:
      - mercado: NYSE
        fecha: 2026-01-01
        descripcion: "Año Nuevo"
      - mercado: NASDAQ
        fecha: 2026-01-01
        descripcion: "Año Nuevo"
      - mercado: NYSE
        fecha: 2026-12-25
        descripcion: "Navidad"
      - mercado: LSE
        fecha: 2026-12-25
        descripcion: "Christmas Day"
      - mercado: TSE
        fecha: 2026-01-01
        descripcion: "Ganjitsu (Año Nuevo)"
      - mercado: ASX
        fecha: 2026-01-26
        descripcion: "Australia Day"
