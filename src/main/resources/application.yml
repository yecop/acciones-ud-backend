spring:
  application:
    name: acciones-ud-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

accionesud:
  security:
    usuario: ${ACCIONESUD_SECURITY_USUARIO:}
    clave: ${ACCIONESUD_SECURITY_CLAVE:}
    roles: ${ACCIONESUD_SECURITY_ROLES:INVERSIONISTA}
