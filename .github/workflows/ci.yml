name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verificar build
        run: ./mvnw -B clean verify

      - name: Verificar pruebas de PostgreSQL ejecutadas
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          esperadas = {
              "AuthIntegrationTest",
              "RegistroIntegrationTest",
              "PerfilIntegrationTest",
              "MigracionesIntegrationTest",
              "RedisCotizacionCacheAdapterIntegrationTest",
              "AuditoriaPostgresIntegrationTest",
              "NotificacionesPostgresIntegrationTest",
              "CuentaFondosPostgresIntegrationTest",
              "CanalCorreoMailpitIntegrationTest",
          }
          ejecutadas = set()
          for ruta in glob.glob("target/surefire-reports/TEST-*.xml"):
              raiz = ET.parse(ruta).getroot()
              nombre = raiz.attrib["name"].rsplit(".", 1)[-1]
              if (nombre in esperadas
                      and int(raiz.attrib["tests"]) > 0
                      and int(raiz.attrib.get("skipped", "0")) == 0):
                  ejecutadas.add(nombre)
          faltantes = sorted(esperadas - ejecutadas)
          if faltantes:
              raise SystemExit("Pruebas con infraestructura no ejecutadas: " + ", ".join(faltantes))
          PY

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
